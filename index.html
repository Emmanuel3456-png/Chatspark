 function handleAvatar(file){
  const reader=new FileReader();
  reader.onload=function(){
   const img=new Image();
   img.onload=function(){
    const c=document.createElement('canvas');c.width=200;c.height=200;
    const ctx=c.getContext('2d');const s=Math.max(200/img.width,200/img.height);
    const w=img.width*s;const h=img.height*s;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,200,200);
    ctx.drawImage(img,(200-w)/2,(200-h)/2,w,h);
    setForm(function(f){return {...f,avatar:c.toDataURL('image/jpeg',0.8)};});
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 }
