       React.createElement('button',{onClick:()=>settingsAvatarRef.current&&settingsAvatarRef.current.click(),style:{height:36,padding:'0 16px',borderRadius:99,background:'#5B5BFF',color:'white',fontSize:12,fontWeight:800,display:'flex',alignItems:'center',gap:6,border:'none',boxShadow:'0 0 20px rgba(91,91,255,0.4)'}},React.createElement(Camera,{style:{width:14,height:14}}),'Change Photo'),
       user&&user.avatar?React.createElement('button',{onClick:()=>{const u={...user,avatar:''};setUser(u);toastMsg('Removed - Glowing off');},style:{height:36,padding:'0 16px',borderRadius:99,border:'1px solid '+border,background:bgCard,color:textMain,fontSize:12,fontWeight:700}},'Remove'):null

     ),

      React.createElement('h3',{style:{fontWeight:800,fontSize:14}},'White & Dark + Glow'),

       React.createElement('button',{onClick:()=>setTheme('dark'),style:{height:56,borderRadius:12,border:'2px solid '+(theme==='dark'?'#5B5BFF':'transparent'),background:'#0A0F2C',color:'white',fontWeight:800,fontSize:11}},'Dark Glowing'),
       React.createElement('button',{onClick:()=>setTheme('light'),style:{height:56,borderRadius:12,border:'2px solid '+(theme==='light'?'#5B5BFF':'transparent'),background:'#FFFFFF',color:'black',fontWeight:800,fontSize:11}},'White Glowing')

   React.createElement('div',{style:{width:10,height:10,borderRadius:99,background:'#22C55E',animation:'glowPulse 1s infinite'}}),React.createElement('span',{style:{fontWeight:600}},toast)
  )
 );
