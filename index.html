    if(res.ok){const d=await res.json(); if(d.choices?.[0]?.message) return {text:d.choices[0].message.content};}
  }catch(e){}
  if(!localKey) throw new Error('ENV_NOT_SET');
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${localKey}`},body:JSON.stringify({model:'llama-3.1-70b-versatile',messages})});
  const d=await r.json(); return {text:d.choices[0].message.content};
}
