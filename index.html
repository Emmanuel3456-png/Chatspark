<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Mind</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #07162f;
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
  transition: 0.5s;
}

/* HEADER */
header {
  text-align: center;
  padding: 25px 15px 18px;
  background: #12356b;
  border-bottom: 3px solid #2979ff;
}

.logo {
  font-size: 36px;
  font-weight: bold;
  color: #5ba0ff;
}

.subtitle {
  margin-top: 8px;
  color: #b7c9e8;
}

/* MODE SWITCH */
.mode-area {
  display: flex;
  justify-content: center;
  padding: 18px;
}

.mode-switch {
  position: relative;
  display: flex;
  width: 330px;
  height: 58px;
  padding: 5px;
  background: #10274e;
  border-radius: 30px;
  border: 1px solid #3974c9;
}

.slider {
  position: absolute;
  width: calc(50% - 5px);
  height: 48px;
  left: 5px;
  top: 5px;
  border-radius: 25px;
  background: #2870ed;
  transition: 0.4s;
  box-shadow: 0 0 18px #2870ed;
}

.mode-switch.assistant .slider {
  transform: translateX(100%);
  background: linear-gradient(135deg, #6d3cff, #00c8ff);
  box-shadow:
    0 0 15px #6d3cff,
    0 0 30px #00c8ff;
}

.mode-option {
  position: relative;
  z-index: 2;
  width: 50%;
  border: none;
  background: transparent;
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}

/* APP */
.app {
  position: relative;
  min-height: 520px;
  transition: 0.5s;
}

/* ASSISTANT GLOW BACKGROUND */
body.assistant-mode {
  background:
    radial-gradient(circle at 20% 30%, #192f6a 0%, transparent 35%),
    radial-gradient(circle at 80% 50%, #35145e 0%, transparent 35%),
    #030817;
}

.glow {
  display: none;
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.4;
  pointer-events: none;
  animation: floatGlow 6s infinite alternate ease-in-out;
}

body.assistant-mode .glow {
  display: block;
}

.glow-one {
  width: 220px;
  height: 220px;
  background: #006eff;
  top: 25%;
  left: -80px;
}

.glow-two {
  width: 250px;
  height: 250px;
  background: #8a2be2;
  bottom: 10%;
  right: -100px;
  animation-delay: 1s;
}

@keyframes floatGlow {
  from {
    transform: translateY(-20px) scale(0.9);
  }
  to {
    transform: translateY(40px) scale(1.2);
  }
}

/* STATUS */
.status-bar {
  padding: 12px 20px;
  color: #b7c9e8;
  display: flex;
  justify-content: space-between;
}

#status {
  color: #62ffb0;
}

/* CHAT */
.chat {
  height: 430px;
  overflow-y: auto;
  padding: 15px;
  position: relative;
  z-index: 2;
}

.message {
  max-width: 82%;
  margin: 12px 0;
  padding: 15px 18px;
  border-radius: 22px;
  line-height: 1.5;
  white-space: pre-wrap;
  animation: appear 0.25s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.user {
  margin-left: auto;
  background: #2768e8;
  border-bottom-right-radius: 5px;
}

.ai {
  background: #183269;
  border-bottom-left-radius: 5px;
}

/* TRANSPARENT ASSISTANT MESSAGES */
body.assistant-mode .ai {
  background: rgba(20, 35, 80, 0.35);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(92, 170, 255, 0.35);
  box-shadow:
    0 0 15px rgba(0, 140, 255, 0.15),
    inset 0 0 15px rgba(120, 80, 255, 0.08);
}

.typing {
  opacity: 0.7;
  font-style: italic;
}

/* VOICE ORB */
.orb-area {
  display: none;
  justify-content: center;
  align-items: center;
  padding: 10px;
}

body.assistant-mode .orb-area {
  display: flex;
}

.voice-orb {
  width: 85px;
  height: 85px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  color: white;
  font-size: 28px;

  background:
    radial-gradient(circle at 35% 30%,
      #ffffff,
      #45caff 15%,
      #645cff 45%,
      #321080 75%);

  box-shadow:
    0 0 15px #00bfff,
    0 0 35px #694cff,
    0 0 65px rgba(0, 191, 255, 0.5);

  animation: orbIdle 2.5s infinite ease-in-out;
}

@keyframes orbIdle {
  0%, 100% {
    transform: scale(1);
    box-shadow:
      0 0 15px #00bfff,
      0 0 35px #694cff;
  }

  50% {
    transform: scale(1.08);
    box-shadow:
      0 0 30px #00ffff,
      0 0 60px #8a2be2;
  }
}

.voice-orb.listening {
  animation: listening 0.6s infinite alternate;
}

@keyframes listening {
  from {
    transform: scale(1);
    filter: hue-rotate(0deg);
  }
  to {
    transform: scale(1.2);
    filter: hue-rotate(100deg);
  }
}

.voice-orb.thinking {
  animation: thinking 1s infinite linear;
}

@keyframes thinking {
  from {
    transform: rotate(0deg);
    filter: hue-rotate(0deg);
  }
  to {
    transform: rotate(360deg);
    filter: hue-rotate(360deg);
  }
}

.voice-orb.speaking {
  animation: speaking 0.35s infinite alternate;
}

@keyframes speaking {
  from {
    transform: scale(0.95);
  }
  to {
    transform: scale(1.18);
  }
}

/* INPUT */
.input-area {
  position: sticky;
  bottom: 0;
  z-index: 5;
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #102447;
}

body.assistant-mode .input-area {
  background: rgba(4, 12, 35, 0.65);
  backdrop-filter: blur(18px);
  border-top: 1px solid rgba(90, 160, 255, 0.3);
}

#messageInput {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  border-radius: 25px;
  padding: 14px 17px;
  font-size: 16px;
}

.action-button {
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 50%;
  color: white;
  background: #2768e8;
  font-size: 20px;
  cursor: pointer;
}

#sendButton {
  width: auto;
  padding: 0 20px;
  border-radius: 25px;
  font-weight: bold;
}

#voiceButton {
  background: #13a85a;
}

button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<div class="glow glow-one"></div>
<div class="glow glow-two"></div>

<header>
  <div class="logo">⚛ Quantum Mind</div>
  <div class="subtitle">Think Beyond • Learn Beyond</div>
</header>

<div class="mode-area">
  <div class="mode-switch" id="modeSwitch">
    <div class="slider"></div>

    <button class="mode-option" id="chatbotMode">
      💬 Chatbot
    </button>

    <button class="mode-option" id="assistantMode">
      ✨ Assistant
    </button>
  </div>
</div>

<div class="app">

  <div class="status-bar">
    <span id="modeLabel">💬 Chatbot Mode</span>
    <span id="status">● Ready</span>
  </div>

  <div class="chat" id="chat">
    <div class="message ai">
      Hello! I am Quantum Mind, a private AI system for
      Softnet Technology Academy. How can I help you today?
    </div>
  </div>

  <div class="orb-area">
    <button class="voice-orb" id="voiceOrb">🎙️</button>
  </div>

</div>

<div class="input-area">

  <input
    id="messageInput"
    type="text"
    placeholder="Ask Quantum Mind..."
    autocomplete="off"
  >

  <button
    class="action-button"
    id="voiceButton"
    title="Voice replies"
  >
    🔊
  </button>

  <button
    class="action-button"
    id="sendButton"
  >
    Send
  </button>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

const chatbotButton =
  document.getElementById("chatbotMode");

const assistantButton =
  document.getElementById("assistantMode");

const modeSwitch =
  document.getElementById("modeSwitch");

const modeLabel =
  document.getElementById("modeLabel");

const statusText =
  document.getElementById("status");

const voiceButton =
  document.getElementById("voiceButton");

const voiceOrb =
  document.getElementById("voiceOrb");

let currentMode = "chatbot";
let sending = false;
let voiceEnabled = true;


/* ADD MESSAGE */
function addMessage(text, type) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;

  return message;
}


/* SWITCH TO CHATBOT */
function activateChatbot() {

  currentMode = "chatbot";

  document.body.classList.remove(
    "assistant-mode"
  );

  modeSwitch.classList.remove(
    "assistant"
  );

  modeLabel.textContent =
    "💬 Chatbot Mode";

  input.placeholder =
    "Chat with Quantum Mind...";

  statusText.textContent =
    "● Ready";
}


/* SWITCH TO ASSISTANT */
function activateAssistant() {

  currentMode = "assistant";

  document.body.classList.add(
    "assistant-mode"
  );

  modeSwitch.classList.add(
    "assistant"
  );

  modeLabel.textContent =
    "✨ AI Assistant Mode";

  input.placeholder =
    "Ask your AI Assistant...";

  statusText.textContent =
    "● Assistant Ready";
}


chatbotButton.addEventListener(
  "click",
  activateChatbot
);

assistantButton.addEventListener(
  "click",
  activateAssistant
);


/* GET AI REPLY */
async function getReply(text) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      function() {
        controller.abort();
      },
      60000
    );

  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: text,
            mode: currentMode
          }),

          signal: controller.signal
        }
      );

    clearTimeout(timeout);

    if (!response.ok) {

      throw new Error(
        "Server error " +
        response.status
      );
    }

    const data =
      await response.json();

    if (!data.reply) {

      throw new Error(
        "No reply received"
      );
    }

    return data.reply;

  } catch (error) {

    clearTimeout(timeout);

    console.log(error);

    if (
      error.name ===
      "AbortError"
    ) {

      return (
        "The request took too long. " +
        "Please try again."
      );
    }

    return (
      "I could not connect to the " +
      "Quantum Mind AI server."
    );
  }
}


/* SPEAK */
function speakReply(text) {

  if (!voiceEnabled) {
    return;
  }

  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      text
    );

  speech.lang = "en-US";
  speech.rate = 0.95;
  speech.pitch = 1;

  speech.onstart =
    function() {

      if (
        currentMode ===
        "assistant"
      ) {

        voiceOrb.className =
          "voice-orb speaking";

        statusText.textContent =
          "● Speaking";
      }
    };

  speech.onend =
    function() {

      voiceOrb.className =
        "voice-orb";

      statusText.textContent =
        "● Ready";
    };

  window.speechSynthesis.speak(
    speech
  );
}


/* SEND MESSAGE */
async function sendMessage() {

  const text =
    input.value.trim();

  if (!text || sending) {
    return;
  }

  sending = true;

  sendButton.disabled = true;

  addMessage(
    text,
    "user"
  );

  input.value = "";

  statusText.textContent =
    "● Thinking";

  if (
    currentMode ===
    "assistant"
  ) {

    voiceOrb.className =
      "voice-orb thinking";
  }

  const typingMessage =
    addMessage(
      currentMode ===
      "assistant"

        ? "AI Assistant is thinking..."

        : "Quantum Mind is typing...",

      "ai typing"
    );

  try {

    const reply =
      await getReply(text);

    typingMessage.remove();

    addMessage(
      reply,
      "ai"
    );

    voiceOrb.className =
      "voice-orb";

    statusText.textContent =
      "● Ready";

    if (
      currentMode ===
      "assistant"
    ) {

      speakReply(reply);
    }

  } catch (error) {

    typingMessage.remove();

    addMessage(
      "Something went wrong.",
      "ai"
    );

    voiceOrb.className =
      "voice-orb";

    statusText.textContent =
      "● Error";
  }

  sending = false;

  sendButton.disabled = false;

  input.focus();
}


/* SEND BUTTON */
sendButton.addEventListener(
  "click",
  sendMessage
);


/* ENTER KEY */
input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      sendMessage();
    }
  }
);


/* VOICE REPLIES BUTTON */
voiceButton.addEventListener(
  "click",
  function() {

    voiceEnabled =
      !voiceEnabled;

    if (voiceEnabled) {

      voiceButton.textContent =
        "🔊";

    } else {

      voiceButton.textContent =
        "🔇";

      if (
        "speechSynthesis"
        in window
      ) {

        window
          .speechSynthesis
          .cancel();
      }
    }
  }
);


/* MICROPHONE */
function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "Voice recognition is not supported by this browser."
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-US";

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;

  voiceOrb.className =
    "voice-orb listening";

  statusText.textContent =
    "● Listening";

  recognition.onresult =
    function(event) {

      const spokenText =
        event.results[0][0]
          .transcript;

      input.value =
        spokenText;

      voiceOrb.className =
        "voice-orb";

      statusText.textContent =
        "● Ready";

      if (
        currentMode ===
        "assistant"
      ) {

        sendMessage();
      }
    };

  recognition.onerror =
    function() {

      voiceOrb.className =
        "voice-orb";

      statusText.textContent =
        "● Voice error";
    };

  recognition.onend =
    function() {

      if (
        !sending
      ) {

        voiceOrb.className =
          "voice-orb";

        statusText.textContent =
          "● Ready";
      }
    };

  recognition.start();
}



voiceOrb.addEventListener(
  "click",
  startListening
);


/* START */
activateChatbot();
</script>

</body>
</html>
