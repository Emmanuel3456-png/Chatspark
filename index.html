async function callGroq(messages, localKey){
  try{
    let res = await fetch('/api/quantum', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages})});
    if(!res.ok) res = await fetch('/.netlify/functions/quantum', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages})});
    if(res.ok){ const d=await res.json(); if(d.choices?.[0]?.message) return {text:d.choices[0].message.content, source:'env'}; }
    const err=await res.json().catch(()=>({}));
    if(err.error?.includes('GROQ_API_KEY')) throw new Error('ENV_NOT_SET');
  }catch(e){}
  if(!localKey) throw new Error('ENV_NOT_SET');
  const directRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${localKey}`}, body:JSON.stringify({model:'llama-3.1-70b-versatile', messages, temperature:0.7, max_tokens:3000})});
  const data=await directRes.json();
  return {text:data.choices[0].message.content, source:'local'};
}
async function checkEnvStatus(){
  try{
    let res = await fetch('/api/quantum', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages:[{role:'user', content:'ping'}]})});
    if(!res.ok) res = await fetch('/.netlify/functions/quantum', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages:[{role:'user', content:'ping'}]})});
    const d=await res.json().catch(()=>({}));
    if(res.ok && d.choices) return {connected:true, message:'GROQ_API_KEY connected ⚡ Secure'};
    if(d.error?.includes('GROQ_API_KEY')) return {connected:false, message:'Not set - Add in Vercel Settings'};
    return {connected:false, message:d.error||'Not ready'};
  }catch(e){ return {connected:false, message:'Function not deployed'}; }
}

    const reader=new FileReader();
    reader.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=200; c.height=200; const ctx=c.getContext('2d'); const s=Math.max(200/img.width,200/img.height); const w=img.width*s; const h=img.height*s; ctx.fillStyle='#fff'; ctx.fillRect(0,0,200,200); ctx.drawImage(img,(200-w)/2,(200-h)/2,w,h); setter(c.toDataURL('image/jpeg',0.8)); }; img.src=reader.result; }; reader.readAsDataURL(file);
  }

    if('contacts' in navigator && 'ContactsManager' in window){

        const contacts = await navigator.contacts.select(props, opts);

          source: 'device'

    if(!onboardForm.name.trim()||!onboardForm.username.trim()||!onboardForm.phone.trim()){ showToastMsg('Fill name, username, phone'); return; }

  }

  function addRealFriend(contact){
    if(!contact.hasApp){ setShowInvite(true); setShowAddFriend(false); showToastMsg(`${contact.name} not on ChatSpark - invite with real link!`); return; }

  }

    if(!chatInput.trim()) return;
