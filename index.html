function getLink(name){
  var base=window.location.origin || "https://your-chatspark.vercel.app";
  var n=(name||"friend").replace(/\s+/g,"");
  return base+"/join/"+encodeURIComponent(n);
}
function openWA(phone,name){
  var link=getLink(name);
  var msg="Hey! Join me on ChatSpark real friends only! "+link;
  var clean=String(phone).replace(/[^0-9]/g,"");
  if(!clean){ alert("Link: "+link); return; }
  window.open("https://wa.me/"+clean+"?text="+encodeURIComponent(msg),"_blank");
}

              setChats(function(ch){var n={}; n[nf.id]=[]; return Object.assign({},ch,n)});

      im.src=img;
    };
    reader.readAsDataURL(file);
  }
