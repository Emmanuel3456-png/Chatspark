<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0F2C">
<title>CHATSPARK - REAL Friends Only</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:Inter,sans-serif;box-sizing:border-box}
body{margin:0;background:#0A0F2C;overflow:hidden;touch-action:manipulation}
.no-scrollbar::-webkit-scrollbar{display:none}
.glow-edge{box-shadow:0 0 0 2px #FF3B30,0 0 0 4px #FF8C00,0 0 0 6px #FFD60A,0 0 0 8px #00C853,0 0 12px rgba(91,91,255,0.5)}
.glow-input:focus{box-shadow:0 0 0 2px #00F0FF,0 0 12px #5B5BFF}
.orb-glow{animation:rainbow 3s linear infinite, float 3s ease-in-out infinite}
@keyframes rainbow{0%{box-shadow:0 0 0 2px #FF3B30,0 0 20px #FF3B30}14%{box-shadow:0 0 0 2px #FF8C00,0 0 20px #FF8C00}28%{box-shadow:0 0 0 2px #FFD60A,0 0 20px #FFD60A}42%{box-shadow:0 0 0 2px #00C853,0 0 20px #00C853}56%{box-shadow:0 0 0 2px #00F0FF,0 0 20px #00F0FF}71%{box-shadow:0 0 0 2px #5B5BFF,0 0 20px #5B5BFF}85%{box-shadow:0 0 0 2px #9C27B0,0 0 20px #9C27B0}100%{box-shadow:0 0 0 2px #FF1493,0 0 20px #FF1493}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.top-glow{height:3px;background:linear-gradient(90deg,#FF3B30,#FF8C00,#FFD60A,#00C853,#00F0FF,#5B5BFF,#9C27B0,#FF1493);background-size:200% 100%;animation:slide 3s linear infinite}
@keyframes slide{0%{background-position:0%}100%{background-position:200%}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;

function getInviteLink(myName){
  const base = window.location.origin || 'https://your-chatspark.vercel.app';
  const n = (myName||'friend').replace(/\s+/g,'');
  return base+'/join/'+encodeURIComponent(n);
}
function openInvite(phone, myName){
  const link=getInviteLink(myName);
  const msg='Hey! Join me on ChatSpark - real friends only! '+link;
  const clean=String(phone).replace(/[^0-9]/g,'');
  if(!clean){ alert('No phone number. Link: '+link); return; }
  const wa='https://wa.me/'+clean+'?text='+encodeURIComponent(msg);
  window.open(wa,'_blank');
}

function App(){
  const [user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('cs_user')||'null')}catch{return null}});
  const [userPic,setUserPic]=useState(()=>{try{return localStorage.getItem('cs_user_pic')||''}catch{return ''}});
  const [view,setView]=useState('chats');
  const [filter,setFilter]=useState('all');
  const [friends,setFriends]=useState(()=>{try{return JSON.parse(localStorage.getItem('cs_friends')||'[]')}catch{return []}});
  const [groups,setGroups]=useState(()=>{try{return JSON.parse(localStorage.getItem('cs_groups')||'[]')}catch{return []}});
  const [channels,setChannels]=useState(()=>{try{return JSON.parse(localStorage.getItem('cs_channels')||'[]')}catch{return []}});
  const [statuses,setStatuses]=useState(()=>{try{return JSON.parse(localStorage.getItem('cs_statuses')||'[]')}catch{return []}});
  const [calls,setCalls]=useState(()=>{try{return JSON.parse(localStorage.getItem('cs_calls')||'[]')}catch{return []}});
  const [chats,setChats]=useState(()=>{try{return JSON.parse(localStorage.getItem('cs_chats')||'{}')}catch{return {}}});
  const [favs,setFavs]=useState(()=>{try{return JSON.parse(localStorage.getItem('cs_favs')||'[]')}catch{return []}});
  const [showAdd,setShowAdd]=useState(false);
  const [showGroup,setShowGroup]=useState(false);
  const [showChannel,setShowChannel]=useState(false);
  const [showStatus,setShowStatus]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [showCallsMenu,setShowCallsMenu]=useState(false);
  const [showChatsMenu,setShowChatsMenu]=useState(false);
  const [showUpdatesMenu,setShowUpdatesMenu]=useState(false);
  const [showToolsMenu,setShowToolsMenu]=useState(false);
  const [activeChat,setActiveChat]=useState(null);
  const [msgInput,setMsgInput]=useState('');
  const [search,setSearch]=useState('');
  const [apiStatus,setApiStatus]=useState('Checking...');
  const [groqKey,setGroqKey]=useState(()=>{try{return localStorage.getItem('groq_api_key')||''}catch{return ''}});
  const [qOpen,setQOpen]=useState(false);
  const [qMessages,setQMessages]=useState(()=>{try{return JSON.parse(localStorage.getItem('cs_qmsgs')||'[]')}catch{return []}});
  const [qInput,setQInput]=useState('');
  const [deferredPrompt,setDeferredPrompt]=useState(null);
  const [isInstalled,setIsInstalled]=useState(false);
  const fileInputRef=useRef(null);
  const picInputRef=useRef(null);
  const statusInputRef=useRef(null);

  // Persist
  useEffect(()=>{try{localStorage.setItem('cs_friends',JSON.stringify(friends))}catch{}},[friends]);
  useEffect(()=>{try{localStorage.setItem('cs_groups',JSON.stringify(groups))}catch{}},[groups]);
  useEffect(()=>{try{localStorage.setItem('cs_channels',JSON.stringify(channels))}catch{}},[channels]);
  useEffect(()=>{try{localStorage.setItem('cs_statuses',JSON.stringify(statuses))}catch{}},[statuses]);
  useEffect(()=>{try{localStorage.setItem('cs_calls',JSON.stringify(calls))}catch{}},[calls]);
  useEffect(()=>{try{localStorage.setItem('cs_chats',JSON.stringify(chats))}catch{}},[chats]);
  useEffect(()=>{try{localStorage.setItem('cs_favs',JSON.stringify(favs))}catch{}},[favs]);
  useEffect(()=>{try{localStorage.setItem('cs_qmsgs',JSON.stringify(qMessages))}catch{}},[qMessages]);
  useEffect(()=>{try{if(user) localStorage.setItem('cs_user',JSON.stringify(user))}catch{}},[user]);

  // PWA install
  useEffect(()=>{
    const checkInstalled=()=>{if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone) setIsInstalled(true)};
    checkInstalled();
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();setDeferredPrompt(e)});
    window.addEventListener('appinstalled',()=>{setIsInstalled(true);setDeferredPrompt(null)});
  },[]);

  // API check
  useEffect(()=>{
    fetch('/api/quantum',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'ping',apiKey:groqKey})}).then(r=>r.json()).then(d=>setApiStatus(d.status||'OK')).catch(()=>setApiStatus('FETCH_ERROR'));
  },[]);

  // Real contacts picker
  const pickRealContacts=async()=>{
    try{
      if('contacts' in navigator && 'ContactsManager' in window){
        const props=['name','tel'];
        const opts={multiple:true};
        const contacts=await navigator.contacts.select(props,opts);
        if(!contacts||!contacts.length){alert('No contacts selected');return;}
        const list=contacts.map(c=>{
          const name=c.name&&c.name[0]||'Unknown';
          const phone=c.tel&&c.tel[0]||'';
          return {id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2),name,phone,hasApp:false};
        });
        // Ask for each if on Chatspark
        for(let ct of list){
          const has=confirm(ct.name+' ('+ct.phone+')\nIs this person USING ChatSpark?\nOK = Yes (Add), Cancel = No (Invite)');
          if(has){
            const nf={id:ct.id,name:ct.name,phone:ct.phone};
            if(!friends.find(f=>f.phone===ct.phone)){
              setFriends(f=>[...f,nf]);
              setChats(ch=>({...ch,[nf.id]:ch[nf.id]||[]}));
              try{let reg=JSON.parse(localStorage.getItem('cs_chatspark_users')||'[]');reg.push(ct.phone);localStorage.setItem('cs_chatspark_users',JSON.stringify([...new Set(reg)]))}catch{}
            }
          }else{
            if(confirm('Invite '+ct.name+' via WhatsApp with real link?')){
              openInvite(ct.phone,user?.name||'friend');
            }
          }
        }
        setShowAdd(false);
      }else{
        const name=prompt('Enter REAL contact name from your phone:');
        const phone=prompt('Enter phone number (e.g. 080... or +234...):');
        if(!name||!phone) return;
        const has=confirm(name+'\nIs this person USING ChatSpark? OK=Yes Add, Cancel=Invite');
        if(has){
          const nf={id:'c_'+Date.now(),name,phone};
          if(!friends.find(f=>f.phone===phone)){
            setFriends(f=>[...f,nf]);
            setChats(ch=>({...ch,[nf.id]:[]}));
          }
          setShowAdd(false);
        }else{
          if(confirm('Invite '+name+' via WhatsApp?')) openInvite(phone,user?.name||'friend');
        }
      }
    }catch(e){alert('Contacts error: '+e.message+'\nTry manual add.');}
  };

  const sendMessage=()=>{
    if(!msgInput.trim()||!activeChat) return;
    const isGroup=activeChat.startsWith('g_');
    const isChannel=activeChat.startsWith('ch_');
    const newMsg={id:Date.now(),from:'me',text:msgInput,time:new Date().toLocaleTimeString(),read:false};
    setChats(prev=>{
      const arr=prev[activeChat]||[];
      return {...prev,[activeChat]:[...arr,newMsg]};
    });
    setMsgInput('');
    // Add call log for demo? no
    // Simulate reply only if Quantum Mind (special contact)
    if(activeChat==='quantum'){
      (async()=>{
        try{
          const res=await fetch('/api/quantum',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:newMsg.text,history:qMessages,apiKey:groqKey})});
          const data=await res.json();
          setApiStatus(data.status||'');
          const reply={id:Date.now()+1,from:'them',text:data.reply||'No reply',time:new Date().toLocaleTimeString(),read:false};
          setChats(p=>({...p,[activeChat]:[...(p[activeChat]||[]),reply]}));
        }catch(e){
          const reply={id:Date.now()+1,from:'them',text:'API Error: '+e.message+' Fix: Vercel Env GROQ_API_KEY',time:new Date().toLocaleTimeString()};
          setChats(p=>({...p,[activeChat]:[...(p[activeChat]||[]),reply]}));
        }
      })();
    }
  };

  const toggleFav=(id)=>{
    setFavs(f=> f.includes(id)? f.filter(x=>x!==id): [...f,id]);
  };

  const markAllRead=(id)=>{
    setChats(prev=>{
      const arr=(prev[id]||[]).map(m=>({...m,read:true}));
      return {...prev,[id]:arr};
    });
  };

  const createGroupReal=()=>{
    const gName=prompt('Group name (real):');
    if(!gName) return;
    const selected=[];
    friends.forEach(f=>{
      if(confirm('Add '+f.name+' to group '+gName+'?')) selected.push(f.id);
    });
    if(selected.length===0){alert('Select at least 1 real friend');return;}
    const gid='g_'+Date.now();
    const ng={id:gid,name:gName,members:selected,created:new Date().toISOString()};
    setGroups(g=>[...g,ng]);
    setChats(c=>({...c,[gid]:[{id:Date.now(),from:'system',text:'Group '+gName+' created with '+selected.length+' members',time:new Date().toLocaleTimeString()}]}));
    setShowGroup(false);
    setActiveChat(gid);
  };

  const createChannelReal=()=>{
    const name=prompt('Channel name (e.g. KGSB, Just Stickers):');
    if(!name) return;
    const desc=prompt('Channel description:')||'';
    const cid='ch_'+Date.now();
    const ch={id:cid,name,desc,created:new Date().toISOString(),followers:1};
    setChannels(cs=>[...cs,ch]);
    setChats(c=>({...c,[cid]:[{id:Date.now(),from:'system',text:'Channel '+name+' created! Invite real people via link: '+getInviteLink(user?.name),time:new Date().toLocaleTimeString()}]}));
    setShowChannel(false);
  };

  const addStatusReal=()=>{
    const text=prompt('Status text (or leave empty for photo):')||'';
    if(!text && !statusInputRef.current) return;
    if(text){
      const st={id:'s_'+Date.now(),text,name:user?.name||'Me',pic:userPic,time:new Date().toISOString(),views:0};
      setStatuses(s=>[st,...s]);
      setShowStatus(false);
    }else{
      statusInputRef.current?.click();
    }
  };

  const handleStatusFile=(e)=>{
    const file=e.target.files?.[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const st={id:'s_'+Date.now(),text:'',image:reader.result,name:user?.name||'Me',pic:userPic,time:new Date().toISOString(),views:0};
      setStatuses(s=>[st,...s]);
      setShowStatus(false);
    };
    reader.readAsDataURL(file);
  };

  const handlePicUpload=(e)=>{
    const file=e.target.files?.[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const img=reader.result;
      // Crop to square 300x300 via canvas
      const c=document.createElement('canvas');
      c.width=300;c.height=300;
      const ctx=c.getContext('2d');
      const im=new Image();
      im.onload=()=>{
        const size=Math.min(im.width,im.height);
        const sx=(im.width-size)/2, sy=(im.height-size)/2;
        ctx.drawImage(im,sx,sy,size,size,0,0,300,300);
        const out=c.toDataURL('image/jpeg',0.9);
        setUserPic(out);
        try{localStorage.setItem('cs_user_pic',out)}catch{}
      };
      im.src=img;
    };
    reader.readAsDataURL(file);
  };

  // Derived lists
  const filteredFriends=()=>{
    let list=friends;
    if(filter==='favourite') list=list.filter(f=>favs.includes(f.id));
    if(filter==='unread') list=list.filter(f=>{
      const msgs=chats[f.id]||[];
      return msgs.some(m=>m.from!=='me'&&!m.read);
    });
    if(search) list=list.filter(f=>f.name.toLowerCase().includes(search.toLowerCase()));
    return list;
  };

  const filteredGroups=()=>{
    let list=groups;
    if(search) list=list.filter(g=>g.name.toLowerCase().includes(search.toLowerCase()));
    return list;
  };

  const totalUnread=()=>{
    let n=0;
    Object.keys(chats).forEach(id=>{
      (chats[id]||[]).forEach(m=>{if(m.from!=='me'&&!m.read) n++});
    });
    return n;
  };

  // Onboarding
  if(!user){
    return React.createElement('div',{style:{minHeight:'100vh',background:'#0A0F2C',display:'flex',alignItems:'center',justifyContent:'center',padding:20}},
      React.createElement('div',{style:{width:'100%',maxWidth:360,background:'#111B21',borderRadius:16,padding:24,border:'2px solid #5B5BFF'}},
        React.createElement('div',{style:{textAlign:'center',marginBottom:20}},
          React.createElement('div',{style:{width:64,height:64,margin:'0 auto 12px',background:'linear-gradient(135deg,#5B5BFF,#00F0FF)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28}},'⚡'),
          React.createElement('h1',{style:{color:'white',fontSize:22,fontWeight:800,margin:0}},'CHATSPARK'),
          React.createElement('p',{style:{color:'#8696A0',fontSize:12,marginTop:4}},'REAL friends only - No fake data')
        ),
        React.createElement('input',{id:'onName',placeholder:'Your real name',style:{width:'100%',padding:'12px',borderRadius:10,border:'1px solid #2A3942',background:'#202C33',color:'white',marginBottom:12}}),
        React.createElement('input',{id:'onPhone',placeholder:'Your real phone (for invite link)',style:{width:'100%',padding:'12px',borderRadius:10,border:'1px solid #2A3942',background:'#202C33',color:'white',marginBottom:16}}),
        React.createElement('button',{onClick:()=>{
          const n=document.getElementById('onName').value.trim();
          const p=document.getElementById('onPhone').value.trim();
          if(!n){alert('Enter real name');return;}
          const u={name:n,phone:p||''};
          setUser(u);
          try{localStorage.setItem('cs_user',JSON.stringify(u))}catch{}
          // Auto add Quantum Mind as friend (real AI)
          setFriends([{id:'quantum',name:'Quantum Mind',phone:'AI',isAI:true}]);
          setChats({'quantum':[{id:1,from:'them',text:'Hi '+n+'! I am Quantum Mind - your real AI assistant. Ask me coding, business, anything! 🌈',time:new Date().toLocaleTimeString()}]});
        },style:{width:'100%',padding:'12px',borderRadius:10,background:'#5B5BFF',color:'white',border:'none',fontWeight:700,fontSize:14}},'Start Chatting - REAL')
      )
    );
  }

  // Main UI
  return React.createElement('div',{style:{height:'100vh',display:'flex',flexDirection:'column',background:'#111B21',position:'relative'}},
    React.createElement('div',{className:'top-glow'}),
    // Top bar
    React.createElement('div',{style:{height:60,background:'#202C33',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 12px',borderBottom:'1px solid #2A3942'}},
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10}},
        React.createElement('div',{style:{width:36,height:36,borderRadius:10,background:'linear-gradient(135deg,#5B5BFF,#00F0FF)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,color:'white'}},'⚡'),
        React.createElement('div',{},
          React.createElement('div',{style:{color:'white',fontWeight:800,fontSize:16,lineHeight:1}},'CHATSPARK'),
          React.createElement('div',{style:{color:'#00A884',fontSize:10}},'REAL friends')
        ),
        !isInstalled && deferredPrompt ? React.createElement('button',{onClick:async()=>{try{deferredPrompt.prompt();const c=await deferredPrompt.userChoice; if(c.outcome==='accepted') setIsInstalled(true); setDeferredPrompt(null);}catch{}},style:{marginLeft:8,padding:'4px 8px',borderRadius:20,background:'#00A884',color:'white',fontSize:10,border:'none',fontWeight:700}},'Install') : null
      ),
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10}},
        React.createElement('div',{onClick:()=>picInputRef.current?.click(),style:{width:32,height:32,borderRadius:99,background:userPic?`url(${userPic}) center/cover`:'#5B5BFF',border:'2px solid #00F0FF',cursor:'pointer'}}),
        React.createElement('input',{type:'file',ref:picInputRef,accept:'image/*',style:{display:'none'},onChange:handlePicUpload}),
        React.createElement('button',{onClick:()=>setShowSettings(true),style:{background:'transparent',border:'none',color:'white',fontSize:20}},'⋮')
      )
    ),
    // Filter bar (only for chats view)
    view==='chats' ? React.createElement('div',{style:{background:'#111B21',padding:'8px 12px',display:'flex',gap:6,overflowX:'auto',borderBottom:'1px solid #202C33'}},
      ['all','unread','favourite','groups'].map(f=>
        React.createElement('button',{key:f,onClick:()=>setFilter(f),style:{padding:'6px 12px',borderRadius:20,border:'none',background:filter===f?'#00A884':'#202C33',color:'white',fontSize:12,fontWeight:filter===f?700:400,whiteSpace:'nowrap'}}, f==='favourite'?'Favourite':f.charAt(0).toUpperCase()+f.slice(1)+(f==='unread' && totalUnread()>0 ? ' ('+totalUnread()+')' : ''))
      ),
      React.createElement('div',{style:{flex:1}}),
      React.createElement('button',{onClick:()=>setShowChatsMenu(v=>!v),style:{background:'#202C33',border:'none',color:'white',borderRadius:20,padding:'6px 10px',fontSize:12}},'☰')
    ) : null,
    // Search
    React.createElement('div',{style:{background:'#111B21',padding:'8px 12px'}},
      React.createElement('input',{value:search,onChange:e=>setSearch(e.target.value),placeholder:'Search real friends...',style:{width:'100%',padding:'10px 12px',borderRadius:10,border:'1px solid #2A3942',background:'#202C33',color:'white',fontSize:13}})
    ),
    // Menus
    showChatsMenu ? React.createElement('div',{style:{position:'absolute',top:110,right:12,zIndex:50,background:'#202C33',borderRadius:12,padding:8,minWidth:200,boxShadow:'0 8px 24px rgba(0,0,0,0.5)'}},
      React.createElement('button',{onClick:()=>{setShowChatsMenu(false);setShowGroup(true)},style:{display:'block',width:'100%',textAlign:'left',padding:'10px',background:'transparent',border:'none',color:'white',fontSize:13}},'New group'),
      React.createElement('button',{onClick:()=>{setShowChatsMenu(false);alert('New broadcast: Select real friends to broadcast to')},style:{display:'block',width:'100%',textAlign:'left',padding:'10px',background:'transparent',border:'none',color:'white',fontSize:13}},'New broadcast'),
      React.createElement('button',{onClick:()=>{setShowChatsMenu(false);setView('tools')},style:{display:'block',width:'100%',textAlign:'left',padding:'10px',background:'transparent',border:'none',color:'white',fontSize:13}},'Communities'),
      React.createElement('button',{onClick:()=>{setShowChatsMenu(false);setFilter('favourite')},style:{display:'block',width:'100%',textAlign:'left',padding:'10px',background:'transparent',border:'none',color:'white',fontSize:13}},'Lists'),
      React.createElement('button',{onClick:()=>{setShowChatsMenu(false);alert('Linked devices: This is web version')},style:{display:'block',width:'100%',textAlign:'left',padding:'10px',background:'transparent',border:'none',color:'white',fontSize:13}},'Linked devices'),
      React.createElement('button',{onClick:()=>{setShowChatsMenu(false);setFilter('favourite')},style:{display:'block',width:'100%',textAlign:'left',padding:'10px',background:'transparent',border:'none',color:'white',fontSize:13}},'Starred'),
      React.createElement('button',{onClick:()=>{setShowChatsMenu(false);setShowSettings(true)},style:{display:'block',width:'100%',textAlign:'left',padding:'10px',background:'transparent',border:'none',color:'white',fontSize:13}},'Settings •')
    ) : null,

    // Main content
    React.createElement('div',{style:{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',background:'#0B141A'}},
      // CHATS VIEW
      view==='chats' && !activeChat ? React.createElement('div',{},
        filter!=='groups' ? filteredFriends().map(f=>{
          const msgs=chats[f.id]||[];
          const last=msgs[msgs.length-1];
          const unread=msgs.filter(m=>m.from!=='me'&&!m.read).length;
          const isFav=favs.includes(f.id);
          return React.createElement('div',{key:f.id,onClick:()=>{setActiveChat(f.id);markAllRead(f.id)},style:{display:'flex',alignItems:'center',gap:12,padding:'12px',borderBottom:'1px solid #202C33',background:unread>0?'#1A2A33':'transparent',cursor:'pointer'}},
            React.createElement('div',{style:{width:48,height:48,borderRadius:99,background:f.isAI?'linear-gradient(135deg,#5B5BFF,#00F0FF)':'#2A3942',display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,fontSize:16}}, f.isAI?'🧠':f.name.charAt(0).toUpperCase()),
            React.createElement('div',{style:{flex:1,minWidth:0}},
              React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
                React.createElement('div',{style:{color:'white',fontWeight:unread>0?700:500,fontSize:15,display:'flex',alignItems:'center',gap:6}}, f.name, isFav?React.createElement('span',{style:{color:'#FFD60A'}},'★'):null),
                React.createElement('div',{style:{color:unread>0?'#00A884':'#8696A0',fontSize:11}}, last?last.time:'')

        React.createElement('button',{onClick:()=>{const name=prompt('Real name:'); const phone=prompt('Phone:'); if(name&&phone){if(confirm(name+' using ChatSpark?')){setFriends(f=>[...f,{id:'c_'+Date.now(),name,phone}]); setShowAdd(false)} else {openInvite(phone,user?.name)}}},style:{width:'100%',padding:'12px',borderRadius:10,background:'#2A3942',color:'white',border:'1px solid #5B5BFF',marginBottom:10}},'✍️ Manual Add Real Contact'),
        React.createElement('button',{onClick:()=>setShowAdd(false),style:{width:'100%',padding:'10px',borderRadius:10,background:'transparent',color:'#8696A0',border:'none'}},'Cancel')
      )
    ) : null,

    // Group Modal
    showGroup ? React.createElement('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',zIndex:90,display:'flex',alignItems:'center',justifyContent:'center',padding:20}},
      React.createElement('div',{style:{width:'100%',maxWidth:360,background:'#202C33',borderRadius:16,padding:20}},
        React.createElement('h3',{style:{color:'white',fontWeight:700,marginBottom:12}},'New Group - REAL friends'),
        React.createElement('p',{style:{color:'#8696A0',fontSize:12,marginBottom:12}},'Select real friends from your contacts. Group with real members only.'),
        React.createElement('button',{onClick:createGroupReal,style:{width:'100%',padding:'12px',borderRadius:10,background:'#5B5BFF',color:'white',border:'none',fontWeight:700,marginBottom:10}},'👥 Create Real Group'),
        React.createElement('button',{onClick:()=>setShowGroup(false),style:{width:'100%',padding:'10px',background:'transparent',color:'#8696A0',border:'none'}},'Cancel')
      )
    ) : null,

    // Channel Modal
    showChannel ? React.createElement('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',zIndex:90,display:'flex',alignItems:'center',justifyContent:'center',padding:20}},
      React.createElement('div',{style:{width:'100%',maxWidth:360,background:'#202C33',borderRadius:16,padding:20}},
        React.createElement('h3',{style:{color:'white',fontWeight:700,marginBottom:12}},'Create Channel - Like WhatsApp'),
        React.createElement('p',{style:{color:'#8696A0',fontSize:12,marginBottom:12}},'Real channel like KGSB, Just Stickers, WAEC. Real followers.'),
        React.createElement('button',{onClick:createChannelReal,style:{width:'100%',padding:'12px',borderRadius:10,background:'#00A884',color:'white',border:'none',fontWeight:700,marginBottom:10}},'📢 Create Real Channel'),
        React.createElement('button',{onClick:()=>setShowChannel(false),style:{width:'100%',padding:'10px',background:'transparent',color:'#8696A0',border:'none'}},'Cancel')
      )
    ) : null,

    // Status Modal
    showStatus ? React.createElement('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',zIndex:90,display:'flex',alignItems:'center',justifyContent:'center',padding:20}},
      React.createElement('div',{style:{width:'100%',maxWidth:360,background:'#202C33',borderRadius:16,padding:20}},
        React.createElement('h3',{style:{color:'white',fontWeight:700,marginBottom:12}},'Add Status - Real Update'),
        React.createElement('button',{onClick:addStatusReal,style:{width:'100%',padding:'12px',borderRadius:10,background:'#00A884',color:'white',border:'none',fontWeight:700,marginBottom:10}},'✍️ Text Status'),
        React.createElement('button',{onClick:()=>statusInputRef.current?.click(),style:{width:'100%',padding:'12px',borderRadius:10,background:'#2A3942',color:'white',border:'1px solid #5B5BFF',marginBottom:10}},'📷 Photo Status'),
        React.createElement('input',{type:'file',ref:statusInputRef,accept:'image/*',style:{display:'none'},onChange:handleStatusFile}),
        React.createElement('button',{onClick:()=>setShowStatus(false),style:{width:'100%',padding:'10px',background:'transparent',color:'#8696A0',border:'none'}},'Cancel')
      )
    ) : null,

    // Settings - SCROLLABLE
    showSettings ? React.createElement('div',{style:{position:'fixed',inset:0,background:'#111B21',zIndex:95,display:'flex',flexDirection:'column'}},
      React.createElement('div',{style:{height:56,background:'#202C33',display:'flex',alignItems:'center',gap:10,padding:'0 12px'}},
        React.createElement('button',{onClick:()=>setShowSettings(false),style:{background:'transparent',border:'none',color:'white',fontSize:20}},'←'),
        React.createElement('div',{style:{color:'white',fontWeight:700}},'Settings - REAL')
      ),
      React.createElement('div',{style:{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:16,paddingBottom:140,maxHeight:'calc(100vh - 56px)'}},
        React.createElement('div',{style:{background:'#202C33',borderRadius:12,padding:16,marginBottom:12}},
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:12}},
            React.createElement('div',{onClick:()=>picInputRef.current?.click(),style:{width:56,height:56,borderRadius:99,background:userPic?`url(${userPic}) center/cover`:'#5B5BFF',border:'2px solid #00F0FF'}}),
            React.createElement('div',{},
              React.createElement('div',{style:{color:'white',fontWeight:700}}, user?.name),
              React.createElement('div',{style:{color:'#8696A0',fontSize:12}}, user?.phone||'Real user')
            )
          ),
          React.createElement('button',{onClick:()=>picInputRef.current?.click(),style:{marginTop:12,padding:'8px 16px',borderRadius:20,background:'#2A3942',color:'white',border:'none',fontSize:12}},'Change Real Photo (Crop 300x300)')
        ),
        React.createElement('div',{style:{background:'#202C33',borderRadius:12,padding:16,marginBottom:12,border:'2px solid #5B5BFF'}},
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:8}},
            React.createElement('div',{style:{width:10,height:10,borderRadius:99,background:apiStatus==='ENV_OK'?'#22C55E':apiStatus==='ENV_MISSING'?'#EF4444':'#FFD60A'}}),
            React.createElement('div',{style:{color:'white',fontWeight:700,fontSize:12}}, 'Quantum API: '+apiStatus)
          ),
          React.createElement('div',{style:{color:'#8696A0',fontSize:10,marginBottom:8}}, groqKey?'Using local key':'Using Vercel ENV GROQ_API_KEY'),
          React.createElement('input',{type:'text',value:groqKey,onChange:e=>{const v=e.target.value; setGroqKey(v); try{localStorage.setItem('groq_api_key',v)}catch{}},placeholder:'gsk_... optional',style:{width:'100%',padding:'8px',borderRadius:8,border:'1px solid #5B5BFF',background:'white',color:'black',fontSize:11}}),
          React.createElement('button',{onClick:async()=>{setApiStatus('Checking...'); try{const r=await fetch('/api/quantum',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'test',apiKey:groqKey})}); const d=await r.json(); setApiStatus(d.status||''); alert('Reply: '+(d.reply||'').slice(0,200)+'\nStatus:'+d.status);}catch(e){setApiStatus('FETCH_ERROR'); alert('Error: '+e.message);}},style:{marginTop:8,width:'100%',padding:'8px',borderRadius:8,background:'#5B5BFF',color:'white',border:'none',fontSize:11,fontWeight:700}},'Test Real AI'),
          React.createElement('div',{style:{fontSize:9,color:'#8696A0',marginTop:8,lineHeight:'1.4'}}, 'If ENV_MISSING: Vercel Dashboard → your-chatspark → Settings → Environment Variables → Add GROQ_API_KEY=gsk_... → Deployments → Redeploy WITHOUT cache. Get key: console.groq.com')
        ),
        React.createElement('div',{style:{background:'#202C33',borderRadius:12,padding:12,marginBottom:12}},
          React.createElement('div',{style:{color:'white',fontWeight:600,fontSize:13,marginBottom:8}},'Real Stats'),
          React.createElement('div',{style:{color:'#8696A0',fontSize:12}}, 'Real friends: '+friends.length+' • Groups: '+groups.length+' • Channels: '+channels.length+' • Statuses: '+statuses.length+' • Calls: '+calls.length+' • Favorites: '+favs.length+' • Unread: '+totalUnread())
        ),
        React.createElement('div',{style:{background:'#202C33',borderRadius:12,padding:12,marginBottom:12}},
          React.createElement('div',{style:{color:'white',fontWeight:600,fontSize:13,marginBottom:8}},'Real Invite Link (Like WhatsApp)'),
          React.createElement('div',{style:{color:'#00A884',fontSize:11,wordBreak:'break-all',background:'#111B21',padding:8,borderRadius:8}}, getInviteLink(user?.name)),
          React.createElement('div',{style:{display:'flex',gap:8,marginTop:8}},
            React.createElement('button',{onClick:()=>{navigator.clipboard?.writeText(getInviteLink(user?.name)); alert('Copied!')},style:{flex:1,padding:'8px',borderRadius:8,background:'#00A884',color:'white',border:'none',fontSize:11}},'Copy'),
            React.createElement('button',{onClick:()=>openInvite('',user?.name),style:{flex:1,padding:'8px',borderRadius:8,background:'#2A3942',color:'white',border:'none',fontSize:11}},'Share via WhatsApp')
          )
        ),
        React.createElement('button',{onClick:()=>{if(confirm('Clear REAL data? All chats, friends, groups, channels, statuses, calls will be deleted!')){localStorage.clear(); location.reload();}},style:{width:'100%',padding:'12px',borderRadius:10,background:'#FF3B30',color:'white',border:'none',fontWeight:700,marginTop:16}},'Clear Real Data'),
        React.createElement('div',{style:{height:40}})
      )
    ) : null,

    // FAB Add button
    !activeChat && view==='chats' ? React.createElement('button',{onClick:()=>setShowAdd(true),style:{position:'fixed',bottom:80,right:16,width:56,height:56,borderRadius:16,background:'#00A884',border:'none',color:'white',fontSize:24,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(0,0,0,0.3)',zIndex:10}},'+') : null
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
